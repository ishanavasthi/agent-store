name: keep-warm

# Render's free tier spins a service down after ~15 minutes idle, and the cold
# start costs ~30–60s. A judge's or demo viewer's first MCP tool call must not
# pay that (PLAN §11). Pinging every 10 minutes keeps the instance hot.
#
# Setup: add a repository *variable* (Settings → Secrets and variables →
# Actions → Variables) named RENDER_URL, e.g.
#   https://agent-store.onrender.com
# Until it is set, this workflow runs and exits cleanly — it never fails a
# scheduled run just because the service has not been deployed yet.

on:
  schedule:
    # GitHub's scheduler is best-effort and skews under load; 10 minutes is the
    # request, not a guarantee. Well inside Render's ~15-minute idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the deployed health check
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_URL}" ]; then
            echo "::notice::RENDER_URL repository variable is not set — nothing to keep warm yet."
            exit 0
          fi

          url="${RENDER_URL%/}/healthz"
          echo "Pinging ${url}"

          # --max-time 90 covers a genuine cold start; --retry rides out the
          # 502s Render serves while an instance is waking.
          status=$(curl --silent --show-error --location \
                        --max-time 90 \
                        --retry 3 --retry-delay 15 --retry-all-errors \
                        --output response.txt --write-out '%{http_code}' \
                        "${url}") || status="000"

          echo "HTTP ${status}"
          cat response.txt || true

          if [ "${status}" != "200" ]; then
            echo "::warning::Keep-warm ping returned ${status} (expected 200)."
          fi
